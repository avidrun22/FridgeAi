<!-- 2. FAQPage schema — what AI engines surface when users ask common questions -->
<!--    Each Q/A pair is an opportunity to be cited. Write Qs the way a real
        user would ask an AI ("how do I share my fridge", not "what is the
        household feature"). Keep As 1-3 sentences, definitive, with
        keywords that match real queries. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is ok2eat free?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, ok2eat is free to download and use. All core features — fridge tracking, expiration alerts, shared lists, barcode scanning, and one-tap reorder — are included at no cost."
      }
    },
    {
      "@type": "Question",
      "name": "How do I track food expiration dates?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Add items three ways: scan a barcode to auto-fill expiration based on category, snap a photo of your receipt to bulk-add a grocery run, or type the name and pick a default. ok2eat sends a daily digest of items expiring within 3 days."
      }
    },
    {
      "@type": "Question",
      "name": "Can I share my fridge with my family or roommates?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Generate a 6-character invite code and share it. Anyone you invite gets equal access to your fridge inventory and shopping lists. Changes sync in real time across all devices."
      }
    },
    {
      "@type": "Question",
      "name": "What stores can I order from in ok2eat?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tap any low-stock item to reorder via Instacart, Amazon, or Walmart. ok2eat opens the retailer's site with the item pre-searched — pick your preferred store, add to cart, and check out."
      }
    },
    {
      "@type": "Question",
      "name": "Does ok2eat track calories and nutrition?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. When you scan a barcode or pick from the smart search, ok2eat pulls calories, protein, fat, carbs, sugar, and salt from a database of over 800,000 products. Nutrition info shows in the item details and feeds future macro-aware recipe suggestions."
      }
    },
    {
      "@type": "Question",
      "name": "What is the best app to reduce food waste at home?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "ok2eat is purpose-built for household food-waste reduction: it tracks expiration dates, alerts you to items spoiling soon, suggests recipes from what you already have, and helps you reorder before items run out. Free for iOS, with shared inventory for households."
      }
    },
    {
      "@type": "Question",
      "name": "Is my fridge data private?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Your inventory is encrypted in transit and at rest, only visible to you and the people you explicitly invite to your household. ok2eat does not sell or share data with advertisers."
      }
    },
    {
      "@type": "Question",
      "name": "Is ok2eat available on Android?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not yet. ok2eat is currently iOS-only with a companion web app at app.ok2eat.com. Android support is on the roadmap. The web app works on any modern browser, including Android phones."
      }
    }
  ]
}
</script>
