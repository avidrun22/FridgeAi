<!DOCTYPE html>
<!--
  ok2eat — v1.16 launch image for Instagram + Facebook.
  1080 × 1080 (IG square format). Render this in any browser, then:

  HOW TO SCREENSHOT (macOS):
    1. Open this file in Chrome/Safari (drag the .html into a browser tab).
    2. Press Cmd+Shift+4 (the precise screenshot crosshair).
    3. Drag a square around the cream-and-green card. The card has a subtle
       border that makes the edges easy to snap to.
    4. Save. Screenshot will be ~1080×1080 pixels — perfect for IG and FB.

  Alternative (cleaner, no screenshot needed): in Chrome, open DevTools
  (Cmd+Opt+I), Cmd+Shift+P → type "Capture full size screenshot". Saves
  a perfect-resolution PNG of the whole page, no manual cropping.

  No external dependencies. Single HTML file, web-fonts only.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ok2eat — IG launch image (1080×1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3E721D;
    --green-dim: #2A4F12;
    --green-soft: #A6D388;
    --bg: #F0EADC;
    --surface: #F7F3E8;
    --card: #EDE6D2;
    --border: #D6D2C4;
    --text: #1C261C;
    --text-soft: #3A4A38;
    --muted: #6B8264;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #C8C3B5; /* slightly darker around the card so edges are obvious for screenshotting */
    font-family: 'Bricolage Grotesque', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .frame {
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    border-radius: 32px;
    border: 1px solid var(--border);
    padding: 60px 64px 56px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  /* Soft green glow upper-right */
  .frame::before {
    content: '';
    position: absolute;
    top: -200px;
    right: -160px;
    width: 540px;
    height: 540px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(166, 211, 136, 0.45) 0%, transparent 65%);
    pointer-events: none;
  }

  /* Top bar — logo + brand */
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 1;
  }
  .brand svg { width: 56px; height: 56px; flex-shrink: 0; }
  .brand-name {
    font-size: 36px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.8px;
  }
  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 1.6px;
    font-weight: 500;
    margin-top: 36px;
    z-index: 1;
  }
  .eyebrow::before { content: '// '; opacity: 0.5; }

  /* Hook headline */
  .hook {
    font-size: 84px;
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -3px;
    color: var(--text);
    margin-top: 12px;
    z-index: 1;
  }
  .hook .green {
    color: var(--green);
    display: block;
    font-weight: 800;
  }

  /* Stat grid 3 rows × 2 cols */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 38px;
    z-index: 1;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .stat-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    background: rgba(166, 211, 136, 0.25);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stat-icon svg { width: 26px; height: 26px; }
  .stat-body { display: flex; flex-direction: column; min-width: 0; }
  .stat-name {
    font-size: 17px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: -0.2px;
    line-height: 1.2;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.6px;
    line-height: 1.1;
    margin-top: 2px;
  }

  /* Footer / CTA */
  .footer {
    margin-top: auto;
    z-index: 1;
    border-top: 1px solid var(--border);
    padding-top: 24px;
  }
  .footer-cta {
    font-size: 30px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .footer-cta .green { color: var(--green); }
  .footer-meta {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.8px;
    margin-top: 8px;
    text-transform: uppercase;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="frame">

  <!-- Brand bar -->
  <div class="brand">
    <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="36" height="36" rx="8" fill="#F0EADC"/>
      <path fill="#3E721D" d="M35 5.904c2.394 6.042-1.438 20.543-10.5 26.5-9.06 5.957-20.395 3.573-23.097-6.443-1.669-6.186 2.79-10.721 11.851-16.677C22.315 3.327 32.64-.053 35 5.904z"/>
      <path fill="#A6D388" d="M19.815 26.578c-5.757 4.013-13.482 3.097-16.29-.934C.718 21.613 4 14.474 9.757 10.463c5.755-4.011 20.258-9.264 23.068-5.234 2.807 4.03-4.825 16.175-13.01 21.349"/>
      <path fill="#662113" d="M11.162 12.488c3.48-2.332 7.382-1.495 9.798.995 1.433 1.477-.88 5.382-4.359 7.714-3.478 2.33-7.769 1.763-8.239.731-1.44-3.157-.677-7.109 2.8-9.44z"/>
    </svg>
    <span class="brand-name">ok2eat</span>
  </div>

  <p class="eyebrow">most food we throw out is still good</p>

  <h1 class="hook">
    How long does
    <span class="green">{anything} last?</span>
  </h1>

  <div class="stats">
    <div class="stat">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3E721D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l-1 4v3l2 4v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9l2-4V6L8 2z"/></svg>
      </span>
      <div class="stat-body">
        <span class="stat-name">whole milk</span>
        <span class="stat-value">7 days fridge</span>
      </div>
    </div>
    <div class="stat">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3E721D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l9-13 9 13H3z"/><circle cx="9" cy="14" r="0.8" fill="#3E721D"/><circle cx="13" cy="11" r="0.8" fill="#3E721D"/><circle cx="15" cy="15" r="0.8" fill="#3E721D"/></svg>
      </span>
      <div class="stat-body">
        <span class="stat-name">hard cheese</span>
        <span class="stat-value">~6 months</span>
      </div>
    </div>
    <div class="stat">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3E721D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l8-13 6 4-10 10c-2 2-6-1-4-1z"/><path d="M13 6c1-2 3-3 5-2"/><path d="M11 8c-1-1-2-3-1-5"/></svg>
      </span>
      <div class="stat-body">
        <span class="stat-name">whole carrots</span>
        <span class="stat-value">3–4 weeks</span>
      </div>
    </div>
    <div class="stat">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3E721D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="14" rx="9" ry="7"/><path d="M12 7v-3"/><path d="M9 14c0-3 1-6 3-6s3 3 3 6"/><path d="M6 14c0-3 1-5 2-5"/><path d="M16 9c1 0 2 2 2 5"/></svg>
      </span>
      <div class="stat-body">
        <span class="stat-name">winter squash</span>
        <span class="stat-value">1–3 months</span>
      </div>
    </div>
    <div class="stat">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3E721D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c-4 0-7 6-7 12 0 4 3 8 7 8s7-4 7-8c0-6-3-12-7-12z"/></svg>
      </span>
      <div class="stat-body">
        <span class="stat-name">eggs (in shell)</span>
        <span class="stat-value">3–5 weeks</span>
      </div>
    </div>
    <div class="stat">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3E721D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 4 13c0-7 9-11 16-11 0 7-4 16-9 18z"/><path d="M2 22c0-5 4-9 9-9"/></svg>
      </span>
      <div class="stat-body">
        <span class="stat-name">bagged greens</span>
        <span class="stat-value">3–5 days</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <p class="footer-cta">
      look it up free <span class="green">→ ok2eat.com/shelf-life</span>
    </p>
    <p class="footer-meta">660 foods · USDA data · no signup</p>
  </div>

</div>

</body>
</html>
